<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
    button
    {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: bolder;
    font-size: larger;
    color: white;
    }
    button:hover
    {
      background-color: white;
    }
    </style>
</head>
<body>
    <div style="border: 3px solid black; width: 260px; height: 550px;background-color: rgb(0, 0, 0);border-radius: 20px;">
    <fieldset style="width: 250;height: 50px; color: black;background-color: white;border-radius: 20px;">WELCOME TO CALCULATOR</fieldset><br><br>
    <p style="color: white;text-align: end;">0</p>
    <button style="background-color: grey;">AC</button>
    <button style="background-color: grey;">%</button>
    <button style="background-color: grey;">&larr;</button>
    <button style="background-color: rgb(224, 153, 20);">&divide;</button><br><br>
    <button style="background-color:rgb(32, 31, 31);">7</button>
    <button style="background-color:rgb(32, 31, 31);">8</button>
    <button style="background-color: rgb(32, 31, 31)";>9</button>
    <button style="background-color: rgb(224, 153, 20);">&times;</button><br><br>
    <button style="background-color: rgb(32, 31, 31)";>4</button>
    <button style="background-color:rgb(32, 31, 31)";>5</button>
    <button style="background-color: rgb(32, 31, 31);">6</button>
    <button style="background-color: rgb(224, 153, 20);">-</button><br><br>
    <button style="background-color: rgb(32, 31, 31);">1</button>
    <button style="background-color:rgb(32, 31, 31);">2</button>
    <button style="background-color: rgb(32, 31, 31);">3</button>
    <button style="background-color: rgb(224, 153, 20);">+</button><br><br>
    <button style="background-color: rgb(32, 31, 31);">0</button>
    <button style="background-color:rgb(32, 31, 31);">00</button>
    <button style="background-color: rgb(32, 31, 31);">.</button>
    <button style="background-color: rgb(224, 153, 20);">=</button>

</div>
</body>
</html>
