<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<style>
    body{
        background-image: url("Screenshot 2026-08-29 190328.png");
        background-repeat: no-repeat;
        background-position: right top;
        background-attachment: scroll;
    } 
    button{
        margin-bottom: 10px;
    }
    
    
</style>
<body>
    <h1>Student Registration Form</h1><br>
    <label>Full Name:</label>
    <input type="text" placeholder="Enter your name"><br>
    <label>Email:</label>
    <input type="email" placeholder="Enter your email"><br>
    <label>Password:</label>
    <input type="password" placeholder="Enter your password"><br>
    <label>Age:</label>
    <input type="number" placeholder="Enter your age"><br><br>
    <label>Date of Birth:</label>
    <input type="date" ><br><br>
    <label>Gender:</label>
    <input type="radio" placeholder="gender">
    <label>Male</label>
    <input type="radio" placeholder="gender">
    <label>Female</label><br><br>
    <label>Department:</label>
    <select>
        <option>Select</option>
        <option>CSE</option>
        <option>IT</option>
        <option>AIDS</option>
        <option>ECE</option>
        <option>EEE</option>
    </select><br><br>
    <label>Skills:</label>
    <input type="checkbox" placeholder="skill">
    <label>HTML</label>
    <input type="checkbox" placeholder="skill">
    <label>CSS</label>
    <input type="checkbox" placeholder="skill">
    <label>JavaScript</label><br><br>
    <label>Address:</label><br>
    <textarea name="address" placeholder="Enter your Address"></textarea><br><br>
    <label>Phone Number:</label>
    <input type="number" placeholder="Enter your Phone Number"><br><br>
    <button style="background-color: blue;">Submit</button> <button>Save</button> <button>Reset</button>


</body>
</html>
