<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .card{
        width: 250px;
        padding: 10px;
        background-color: gray;
        text-align: center;
        transition: transform 0.3s;
    }
    .answer{
        display: none;
    }
 
    .card:hover .answer{
        display:block;
    }
    span:hover{
        transform: rotateY(90deg);
    }
</style>
<body>
    <div class="card">
    <h2>Is my data safe? <span>^</span></h2>
    <div class="answer">
        <p>Yes,it is safe.</p>
    </div>
</div>
</body>
</html>
